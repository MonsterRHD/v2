rubrics:
  - id: 1
    type: f2p
    text: "文章状态成功提交后才发送对应 Webhook，状态回滚时不会留下已发送的投递确认。"
  - id: 2
    type: f2p
    text: "每个保存事件使用稳定标识和签名，重试保持原标识，成功响应只确认一次。"
  - id: 3
    type: f2p
    text: "超时、连接中断和可重试响应按持久退避调度，重启不会重置尝试历史。"
  - id: 4
    type: f2p
    text: "明确永久拒绝停止自动重试，并通过现有用户界面或 API 显示可操作原因。"
  - id: 5
    type: f2p
    text: "取消保存会撤销未开始投递；结果未知的已发送尝试保留原标识继续确认，不被反向事件覆盖。"
  - id: 6
    type: f2p
    text: "多个实例只能租用同一投递的一次尝试，持有者崩溃后其他实例能接管。"
  - id: 7
    type: p2p
    text: "未启用 Webhook 的用户不创建投递记录，既有文章保存和取消行为保持不变。"
  - id: 8
    type: f2p
    text: "其他保存集成和 Webhook 密钥更新后的后续事件保持原行为。"
