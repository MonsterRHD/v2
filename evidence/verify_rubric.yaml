rubrics:
  - id: 1
    type: f2p
    text: "首次导入先冻结分类与订阅计划并返回稳定导入标识，格式错误不会留下半个可运行批次。"
  - id: 2
    type: f2p
    text: "每个计划项记录创建、合并、临时失败或永久失败，状态可查询且与数据库结果对应。"
  - id: 3
    type: f2p
    text: "同一 OPML 重复提交或同一批次重试不会复制 feed、category，也不会重新处理已成功项。"
  - id: 4
    type: f2p
    text: "进程在任意项后重启可从持久进度继续；临时抓取失败可显式恢复而不重做成功项。"
  - id: 5
    type: f2p
    text: "取消批次后不再启动新抓取，已提交项目保留，晚到结果按取消边界确定归属。"
  - id: 6
    type: f2p
    text: "永久失败项可在修正后按原计划位置重试，并保留其他项目的结果和顺序。"
  - id: 7
    type: p2p
    text: "现有小型同步导入调用和 OPML 导出格式保持兼容。"
  - id: 8
    type: f2p
    text: "完成、部分失败或取消后的汇总数量与实际分类、订阅及失败项逐项一致。"
