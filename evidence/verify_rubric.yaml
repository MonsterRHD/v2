rubrics:
  - id: 1
    type: f2p
    text: "flush-sessions 原子推进持久会话代际并删除旧代会话，命令只在数据库提交后返回成功。"
  - id: 2
    type: f2p
    text: "认证入口拒绝旧代 Cookie，并返回与既有失效会话一致的未认证响应。"
  - id: 3
    type: f2p
    text: "清退开始前已认证的请求在敏感写入前重新确认代际，旧代请求不能在命令成功后提交。"
  - id: 4
    type: f2p
    text: "登录与清退并发时，登录要么提交当前新代会话，要么明确失败，不会创建旧代会话。"
  - id: 5
    type: f2p
    text: "其他实例通过通知失效本地判断；通知丢失时在有界轮询后同样拒绝旧代。"
  - id: 6
    type: f2p
    text: "实例重启后从数据库代际恢复，不会因空缓存重新接受旧 Cookie。"
  - id: 7
    type: f2p
    text: "重复清退保持幂等，API token、公开页面和无会话请求不受 Web 会话代际影响。"
  - id: 8
    type: p2p
    text: "清退完成后的正常登录会创建新代会话，并可按现有过期、登出和清理流程工作。"
